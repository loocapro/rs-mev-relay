[workspace]
resolver = "2"

members = [ "bin/relay", "crates/auth",
    "crates/beacon", "crates/grpc", "crates/http", "crates/primitives", "crates/storage"
    ]


[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rustdoc.all = "warn"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

[workspace.dependencies]
# mev-relay
relay-primitives = { path = "./crates/primitives" }
beacon = { path = "./crates/beacon" }
relay-storage = { path = "./crates/storage" }
relay-grpc-server = { path = "./crates/grpc" }
relay-http-server = { path = "./crates/http" }
relay-auth = { path = "./crates/auth" }

tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["json", "tracing-serde","env-filter", "fmt"] }

tree_hash = "0.6"
tree_hash_derive = "0.6"
ssz_types = "0.6"

tokio = { version = "1.36.0", features = ["full"] }
tokio-stream = "0.1.14"

ethereum_ssz = "0.5"
ethereum_ssz_derive = "0.5"

serde_json = "1.0.94"
serde = { version = "1.0", default-features = false }
serde_with = "3.3.0"

uuid = { version = "1.3.3", features = ["serde","v4"] } 

eyre = "0.6.8"
reqwest = { version = "0.11", features = ["json"] }

futures = "0.3.25"
futures-util = "0.3.25"

thiserror = "1.0.48"
parking_lot = "0.12.1"
url = "2.4.1"

warp = "0.3.6"

metrics-exporter-prometheus = "0.12.1"
metrics = "0.21.1"

# Fix time 0.3.34 E0282 (type annotations for Box) on Rust 1.80+
[patch.crates-io]
time = { git = "https://github.com/time-rs/time", tag = "v0.3.36" }




