serde_json.workspace = true
tracing.workspace = true
ssz_types.workspace = true

typenum = "1.17.0"

c-kzg = "0.4.2"


alloy-primitives = "0.6"



ethereum_ssz.workspace = true
ethereum_ssz_derive.workspace = true



rand = "0.8.5"

metrics.workspace = true
